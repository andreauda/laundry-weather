<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry Weather</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #dfe6e9);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }

        h1 {
            margin-top: 0;
            color: #2d3436;
        }

        .location {
            color: #636e72;
            margin-bottom: 25px;
        }

        .result {
            font-size: 28px;
            font-weight: bold;
            color: #00b894;
            margin: 25px 0;
        }

        .weather {
            text-align: left;
            margin-top: 25px;
        }

        .weather p {
            margin: 10px 0;
            font-size: 18px;
        }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #636e72;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🧺 Laundry Weather</h1>

        <div class="location" id="location"></div>

		<div class="result" id="recommendation"></div>

		<div class="weather">
			<p id="condition"></p>
			<p id="temperature"></p>
			<p id="rain"></p>
			<p id="wind"></p>
		</div>

        <div class="footer">
            Versione MVP • Dati simulati
        </div>
    </div>

<script>

const weather = {
    city: "Torino",
    condition: "Soleggiato",
    temperature: 23,
    rainProbability: 5,
    wind: 9,
    recommendation: "✅ Ottimo giorno per fare la lavatrice"
};

document.getElementById("location").innerText =
    "📍 " + weather.city + ", Italia";

document.getElementById("recommendation").innerText =
    weather.recommendation;

document.getElementById("condition").innerText =
    "☀️ Meteo: " + weather.condition;

document.getElementById("temperature").innerText =
    "🌡️ Temperatura: " + weather.temperature + "°C";

document.getElementById("rain").innerText =
    "🌧️ Probabilità pioggia: " + weather.rainProbability + "%";

document.getElementById("wind").innerText =
    "💨 Vento: " + weather.wind + " km/h";

</script>

</body>
</html>
