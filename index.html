<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry Weather</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #dfe6e9);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }

        h1 {
            margin-top: 0;
            color: #2d3436;
        }

        .location {
            color: #636e72;
            margin-bottom: 25px;
        }

        .result {
            font-size: 28px;
            font-weight: bold;
            color: #00b894;
            margin: 25px 0;
        }

        .weather {
            text-align: left;
            margin-top: 25px;
        }

        .weather p {
            margin: 10px 0;
            font-size: 18px;
        }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #636e72;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🧺 Laundry Weather</h1>

        <div class="location" id="location"></div>

		<div class="result" id="recommendation"></div>

		<div class="weather">
			<p id="condition"></p>
			<p id="temperature"></p>
			<p id="humidity"></p>
			<p id="rain"></p>
			<p id="wind"></p>
		</div>

        <div class="footer">
            Versione MVP • Dati simulati
        </div>
    </div>

<script>

async function loadWeather() {

    try {

        const response = await fetch(
            ""https://api.open-meteo.com/v1/forecast?latitude=45.0703&longitude=7.6869&current=temperature_2m,relative_humidity_2m,wind_speed_10m&hourly=precipitation_probability&forecast_days=1""
        );

        const data = await response.json();

        const weather = {
            city: "Torino",
            temperature: Math.round(data.current.temperature_2m),
			humidity: Math.round(data.current.relative_humidity_2m),
            wind: Math.round(data.current.wind_speed_10m),
            rainProbability: data.hourly.precipitation_probability[0]
        };

        let recommendation = "✅ Ottimo giorno per fare la lavatrice";

        let score = 0;

		/* Pioggia */
		if (weather.rainProbability <= 10) score += 4;
		else if (weather.rainProbability <= 30) score += 2;
		else if (weather.rainProbability <= 50) score -= 2;
		else score -= 5;
		
		/* Umidità */
		if (weather.humidity < 50) score += 3;
		else if (weather.humidity < 65) score += 2;
		else if (weather.humidity < 80) score += 0;
		else score -= 3;
		
		/* Temperatura */
		if (weather.temperature >= 25) score += 3;
		else if (weather.temperature >= 18) score += 2;
		else if (weather.temperature >= 10) score += 1;
		else score -= 2;
		
		/* Vento */
		if (weather.wind >= 10 && weather.wind <= 25) score += 2;
		else if (weather.wind >= 5 && weather.wind < 10) score += 1;
		else if (weather.wind > 40) score -= 1;
		
		let recommendation;
		
		if (score >= 8) {
		    recommendation = "✅ Perfetto per fare la lavatrice";
		}
		else if (score >= 4) {
		    recommendation = "🙂 Condizioni discrete";
		}
		else {
		    recommendation = "❌ Meglio aspettare";
		}

        document.getElementById("location").innerText =
            "📍 " + weather.city + ", Italia";

        document.getElementById("recommendation").innerText =
            recommendation;

        document.getElementById("condition").innerText =
            "🌤️ Dati meteo reali";

        document.getElementById("temperature").innerText =
            "🌡️ Temperatura: " + weather.temperature + "°C";

		document.getElementById("humidity").innerText =
    		"💧 Umidità: " + weather.humidity + "%";

        document.getElementById("rain").innerText =
            "🌧️ Probabilità pioggia: " + weather.rainProbability + "%";

        document.getElementById("wind").innerText =
            "💨 Vento: " + weather.wind + " km/h";

    } catch (error) {

        document.getElementById("recommendation").innerText =
            "❌ Errore nel recupero del meteo";

        console.error(error);
    }
}

loadWeather();

</script>

</body>
</html>
