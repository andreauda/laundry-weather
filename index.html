<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry Weather</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #dfe6e9);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }

        h1 {
            margin-top: 0;
            color: #2d3436;
        }

        .location {
            color: #636e72;
            margin-bottom: 25px;
        }

        .result {
            font-size: 28px;
            font-weight: bold;
            color: #00b894;
            margin: 25px 0;
        }

        .weather {
            text-align: left;
            margin-top: 25px;
        }

        .weather p {
            margin: 10px 0;
            font-size: 18px;
        }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #636e72;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🧺 Laundry Weather</h1>

        <div class="location">
            📍 Torino, Italy
        </div>

        <div class="result">
            ✅ Ottimo giorno per fare la lavatrice
        </div>

        <div class="weather">
            <p>☀️ Meteo: Soleggiato</p>
            <p>🌡️ Temperatura: 23°C</p>
            <p>🌧️ Probabilità pioggia: 5%</p>
            <p>💨 Vento: 9 km/h</p>
        </div>

        <div class="footer">
            Versione MVP • Dati simulati
        </div>
    </div>

</body>
</html>
